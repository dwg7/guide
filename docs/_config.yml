title: DWG7 Guide
description: A practical access layer for understanding, exploring, and contributing to DWG7.
url: https://dwg7.opengis.org
baseurl: /guide
markdown: kramdown
kramdown:
  input: GFM
  toc_levels: 2..3
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
